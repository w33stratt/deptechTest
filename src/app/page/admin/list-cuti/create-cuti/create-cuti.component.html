<div class="container mx-auto p-6">
    <h2 class="text-2xl font-bold text-gray-700 mb-4">{{ cutiId ? 'Edit Cuti' : 'Ajukan Cuti' }}</h2>

    <form [formGroup]="cutiForm" (ngSubmit)="onSubmit()" class="space-y-5 bg-white p-6 rounded-lg shadow-md">
        <div>
            <label class="block mb-1 font-semibold text-gray-700">Alasan Cuti</label>
            <input type="text" formControlName="reason"
                class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Masukkan alasan cuti" />
        </div>

        <div>
            <label class="block mb-1 font-semibold text-gray-700">Tanggal Mulai</label>
            <input type="date" formControlName="startDate"
                class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
            <label class="block mb-1 font-semibold text-gray-700">Tanggal Selesai</label>
            <input type="date" formControlName="endDate"
                class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div *ngIf="errorMessage" class="text-red-600 font-medium">
            {{ errorMessage }}
        </div>

        <div>
            <button type="submit" [disabled]="cutiForm.invalid"
                class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed">
                {{ cutiId ? 'Update' : 'Simpan' }}
            </button>
        </div>
    </form>
</div>
