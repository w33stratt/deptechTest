<app-navbar></app-navbar>

<div class="container mx-auto p-6">
    <!-- Create Pegawai Button -->
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-700">List Pegawai</h2>
        <button (click)="goToCreatePegawai()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
            Create New Pegawai
        </button>


    </div>

    <table class="min-w-full table-auto bg-white border-collapse border border-gray-200">
        <thead>
            <tr class="bg-gray-100">
                <th class="px-4 py-2 text-left">First Name</th>
                <th class="px-4 py-2 text-left">Last Name</th>
                <th class="px-4 py-2 text-left">Email</th>
                <th class="px-4 py-2 text-left">Phone Number</th>
                <th class="px-4 py-2 text-left">Address</th>
                <th class="px-4 py-2 text-left">Gender</th>
                <th class="px-4 py-2 text-left">Cuti</th>
                <th class="px-4 py-2 text-left">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let pegawai of pegawaiList" class="border-b">
                <td class="px-4 py-2">{{ pegawai.firstName }}</td>
                <td class="px-4 py-2">{{ pegawai.lastName }}</td>
                <td class="px-4 py-2">{{ pegawai.email }}</td>
                <td class="px-4 py-2">{{ pegawai.phoneNumber }}</td>
                <td class="px-4 py-2">{{ pegawai.address }}</td>
                <td class="px-4 py-2">{{ pegawai.gender }}</td>
                <td class="px-4 py-2">
                    <button (click)="goToCuti(pegawai.id)"
                        class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600 ml-2">
                        Lihat Cuti
                    </button>
                </td>
                <td class="px-4 py-2">
                    <button (click)="goToEditPegawai(pegawai.id)"
                        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                        Edit
                    </button>

                    <button (click)="onDeletePegawai(pegawai.id)"
                        class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 ml-2">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

</div>
